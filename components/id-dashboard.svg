<svg width="100%" height="auto" viewBox="0 0 880 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0B12" />
      <stop offset="100%" stop-color="#05060A" />
    </linearGradient>

    <linearGradient id="goldLinear" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#FF9900" />
    </linearGradient>

    <linearGradient id="cyanLinear" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0088FF" />
    </linearGradient>

    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#2D3748" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="hologramScan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0" />
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0" />
    </linearGradient>

    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes scanAnim {
        0% { transform: translateY(-30px); }
        100% { transform: translateY(240px); }
      }
      @keyframes pulseDot {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; }
      }
      .scanner-beam { animation: scanAnim 3s infinite linear; }
      .hud-font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace; }
      .kanji-font { font-family: 'Hiragino Mincho ProN', 'Yu Mincho', serif; }
    </style>
  </defs>

  <!-- Container -->
  <rect x="2" y="2" width="876" height="256" rx="14" fill="url(#cardBg)" stroke="url(#borderGradient)" stroke-width="1.5" />

  <!-- Corner Brackets -->
  <g stroke="#FFD700" stroke-width="2" stroke-linecap="round">
    <path d="M 12 24 L 12 12 L 24 12" />
    <path d="M 868 24 L 868 12 L 856 12" />
    <path d="M 12 236 L 12 248 L 24 248" />
    <path d="M 868 236 L 868 248 L 856 248" />
  </g>

  <!-- Left Side: Digital Slayer License Badge -->
  <g transform="translate(24, 20)">
    <!-- Badge Body -->
    <rect width="250" height="220" rx="10" fill="#0E1019" stroke="#262D3D" stroke-width="1.2" />

    <!-- Scanner Bar (Clipped) -->
    <g clip-path="url(#badgeClip)">
      <rect x="0" y="0" width="250" height="24" fill="url(#hologramScan)" class="scanner-beam" />
    </g>

    <!-- Top Badge Header -->
    <rect x="0" y="0" width="250" height="30" rx="10" fill="#141824" />
    <text x="14" y="20" fill="#FFD700" class="hud-font" font-size="10" font-weight="800" letter-spacing="1.5">SLAYER CORPS // LICENSE</text>
    <circle cx="234" cy="15" r="4" fill="#00F0FF" filter="url(#badgeGlow)" />

    <!-- Avatar Emblem (Thunder Crest Vector) -->
    <g transform="translate(16, 42)">
      <rect width="64" height="64" rx="8" fill="#151926" stroke="#FFD700" stroke-width="1" />
      <!-- Crest Icon -->
      <polygon points="32,8 44,28 34,28 42,56 20,34 30,34" fill="url(#goldLinear)" filter="url(#badgeGlow)" />
    </g>

    <!-- Personal Info Details -->
    <g transform="translate(90, 48)">
      <text x="0" y="12" fill="#FFFFFF" class="hud-font" font-size="13" font-weight="700">ARUN ROSHAN</text>
      <text x="0" y="28" fill="#00F0FF" class="hud-font" font-size="10" font-weight="600" letter-spacing="0.5">@ROSHZORA</text>
      <text x="0" y="44" fill="#9CA3AF" class="hud-font" font-size="9.5">RANK: HASHIRA (ARCHITECT)</text>
      <text x="0" y="58" fill="#FFD700" class="hud-font" font-size="9" font-weight="700">STYLE: THUNDER BREATHING</text>
    </g>

    <!-- Chip & Barcode Row -->
    <g transform="translate(16, 120)">
      <!-- Cyber Smartchip -->
      <rect x="0" y="0" width="34" height="26" rx="4" fill="#FFD700" fill-opacity="0.2" stroke="#FFD700" stroke-width="1" />
      <line x1="17" y1="0" x2="17" y2="26" stroke="#FFD700" stroke-width="0.7" opacity="0.6" />
      <line x1="0" y1="13" x2="34" y2="13" stroke="#FFD700" stroke-width="0.7" opacity="0.6" />

      <!-- Serial Number -->
      <text x="44" y="12" fill="#6B7280" class="hud-font" font-size="8.5" letter-spacing="1">ID: RSZ-9942-THUNDER</text>
      <text x="44" y="24" fill="#9CA3AF" class="hud-font" font-size="8.5">CLEARANCE: LEVEL S+</text>
    </g>

    <!-- Vector Barcode -->
    <g transform="translate(16, 160)" fill="#E5E7EB">
      <rect x="0" y="0" width="2" height="22" />
      <rect x="4" y="0" width="4" height="22" />
      <rect x="11" y="0" width="1" height="22" />
      <rect x="15" y="0" width="3" height="22" />
      <rect x="22" y="0" width="2" height="22" />
      <rect x="26" y="0" width="5" height="22" />
      <rect x="34" y="0" width="2" height="22" />
      <rect x="39" y="0" width="3" height="22" />
      <rect x="45" y="0" width="1" height="22" />
      <rect x="49" y="0" width="4" height="22" />
      <rect x="56" y="0" width="2" height="22" />
      <rect x="61" y="0" width="3" height="22" />
      <rect x="67" y="0" width="1" height="22" />
      <rect x="71" y="0" width="4" height="22" />
      <rect x="78" y="0" width="2" height="22" />
      <rect x="83" y="0" width="6" height="22" />
      <rect x="92" y="0" width="2" height="22" />
      <rect x="97" y="0" width="3" height="22" />
      <rect x="103" y="0" width="5" height="22" />
      <rect x="111" y="0" width="2" height="22" />
      <rect x="116" y="0" width="3" height="22" />
      <rect x="122" y="0" width="1" height="22" />
      <rect x="126" y="0" width="4" height="22" />
      <rect x="133" y="0" width="2" height="22" />
      <rect x="138" y="0" width="4" height="22" />
      <rect x="145" y="0" width="2" height="22" />
      <rect x="150" y="0" width="5" height="22" />
      <rect x="158" y="0" width="3" height="22" />
      <rect x="164" y="0" width="1" height="22" />
      <rect x="168" y="0" width="4" height="22" />
      <rect x="175" y="0" width="2" height="22" />
      <rect x="180" y="0" width="3" height="22" />
      <rect x="186" y="0" width="5" height="22" />
      <rect x="194" y="0" width="2" height="22" />
      <rect x="199" y="0" width="4" height="22" />
      <rect x="206" y="0" width="2" height="22" />
      <rect x="211" y="0" width="3" height="22" />
      <text x="2" y="32" fill="#6B7280" class="hud-font" font-size="7.5" letter-spacing="3">01000010 01011001 01010100 01000101</text>
    </g>
  </g>

  <!-- Right Side: Tactical Mastery Matrix & Real Stats -->
  <g transform="translate(300, 20)">
    <!-- Header -->
    <text x="0" y="16" fill="#FFD700" class="hud-font" font-size="11" font-weight="800" letter-spacing="1.5">TACTICAL MASTERY MATRIX</text>
    <line x1="0" y1="26" x2="550" y2="26" stroke="#262D3D" stroke-width="1" />

    <!-- Skill Bar 1: Flutter & Mobile Systems -->
    <g transform="translate(0, 42)">
      <text x="0" y="0" fill="#E5E7EB" class="hud-font" font-size="11.5" font-weight="600">Cross-Platform Systems (Flutter / Dart / Android SDK)</text>
      <text x="500" y="0" fill="#00F0FF" class="hud-font" font-size="11" font-weight="700">98%</text>
      <rect x="0" y="8" width="540" height="6" rx="3" fill="#151926" />
      <rect x="0" y="8" width="529" height="6" rx="3" fill="url(#cyanLinear)" />
    </g>

    <!-- Skill Bar 2: Offline-First Architecture & DB -->
    <g transform="translate(0, 78)">
      <text x="0" y="0" fill="#E5E7EB" class="hud-font" font-size="11.5" font-weight="600">Offline-First Engine &amp; Cloud Sync (SQLite / Supabase)</text>
      <text x="500" y="0" fill="#FFD700" class="hud-font" font-size="11" font-weight="700">95%</text>
      <rect x="0" y="8" width="540" height="6" rx="3" fill="#151926" />
      <rect x="0" y="8" width="513" height="6" rx="3" fill="url(#goldLinear)" />
