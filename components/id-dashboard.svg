<svg width="800" height="300" viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="50%" stop-color="#FFF" />
      <stop offset="100%" stop-color="#FADA5E" />
    </linearGradient>
  </defs>

  <rect width="800" height="300" fill="#050505" />

  <!-- Lanyard Badge -->
  <g transform="translate(150, 0)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-2 200 50; 2 200 50; -2 200 50" dur="4s" repeatCount="indefinite" />
      
      <!-- Strap -->
      <path d="M 180 0 L 190 100 L 210 100 L 220 0" fill="#FFD700" opacity="0.8" />
      <text x="200" y="50" text-anchor="middle" fill="#000" font-family="sans-serif" font-size="10" font-weight="bold" transform="rotate(90, 200, 50)">DEMON SLAYER CORPS</text>
      
      <!-- Clip -->
      <rect x="190" y="100" width="20" height="10" rx="2" fill="#AAA" />
      
      <!-- ID Card -->
      <g transform="translate(130, 110)">
        <rect width="140" height="200" rx="10" fill="#1A1A1A" stroke="#FFD700" stroke-width="2" />
        
        <!-- Portrait Placeholder -->
        <rect x="20" y="20" width="100" height="100" rx="5" fill="#333" stroke="#FFD700" stroke-width="1" />
        <text x="70" y="75" text-anchor="middle" fill="#FFD700" font-family="sans-serif" font-size="10">PORTRAIT</text>
        
        <!-- Card Details -->
        <text x="20" y="140" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="14">ROSHZEN</text>
        <text x="20" y="155" fill="#A0A0A0" font-family="sans-serif" font-size="10">RANK: Hashira / Architect</text>
        
        <!-- Gold Chip -->
        <rect x="100" y="165" width="20" height="15" rx="2" fill="url(#goldFoil)" />
        
        <!-- Barcode -->
        <rect x="20" y="175" width="100" height="10" fill="#FFF" />
        <rect x="25" y="175" width="2" height="10" fill="#000" />
        <rect x="30" y="175" width="4" height="10" fill="#000" />
        <rect x="38" y="175" width="1" height="10" fill="#000" />
        <rect x="42" y="175" width="3" height="10" fill="#000" />
        
        <!-- Holographic Scan Line -->
        <rect x="0" y="0" width="140" height="2" fill="#00E5FF" opacity="0.5" filter="url(#glow)">
          <animate attributeName="y" values="0;200;0" dur="3s" repeatCount="indefinite" />
        </rect>
      </g>
    </g>
  </g>

  <!-- Dashboard -->
  <g transform="translate(400, 60)">
    <text x="0" y="0" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="20">Slayer Dashboard</text>
    
    <!-- KPI Tiles -->
    <g transform="translate(0, 30)">
      <rect width="100" height="60" rx="10" fill="#1A1A1A" stroke="#333" stroke-width="1" />
      <text x="50" y="25" text-anchor="middle" fill="#A0A0A0" font-family="sans-serif" font-size="12">Commits</text>
      <text x="50" y="45" text-anchor="middle" fill="#FFD700" font-family="monospace" font-size="18" font-weight="bold">
        <tspan>1.2k</tspan>
      </text>
      
      <rect x="110" y="0" width="100" height="60" rx="10" fill="#1A1A1A" stroke="#333" stroke-width="1" />
      <text x="160" y="25" text-anchor="middle" fill="#A0A0A0" font-family="sans-serif" font-size="12">PRs Merged</text>
      <text x="160" y="45" text-anchor="middle" fill="#FFD700" font-family="monospace" font-size="18" font-weight="bold">
        <tspan>480</tspan>
      </text>
      
      <rect x="220" y="0" width="100" height="60" rx="10" fill="#1A1A1A" stroke="#333" stroke-width="1" />
      <text x="270" y="25" text-anchor="middle" fill="#A0A0A0" font-family="sans-serif" font-size="12">Stars</text>
      <text x="270" y="45" text-anchor="middle" fill="#FFD700" font-family="monospace" font-size="18" font-weight="bold">
        <tspan>1.5k</tspan>
      </text>
    </g>
    
    <!-- Now Panel -->
    <g transform="translate(0, 110)">
      <rect width="320" height="60" rx="10" fill="#1A1A1A" stroke="#00E5FF" stroke-width="1" stroke-dasharray="5,5" />
      <text x="20" y="35" fill="#FFFFFF" font-family="sans-serif" font-size="14">NOW: <tspan fill="#00E5FF">Perfecting the Thunderclap Animation</tspan></text>
    </g>
  </g>
</svg>
