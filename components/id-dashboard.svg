    <!-- Skill Bar 3: Full-Stack Web & Realtime Telemetry -->
    <g transform="translate(0, 114)">
      <text x="0" y="0" fill="#E5E7EB" class="hud-font" font-size="11.5" font-weight="600">Full-Stack &amp; Telemetry (React / TypeScript / Python / Node)</text>
      <text x="500" y="0" fill="#00F0FF" class="hud-font" font-size="11" font-weight="700">92%</text>
      <rect x="0" y="8" width="540" height="6" rx="3" fill="#151926" />
      <rect x="0" y="8" width="496" height="6" rx="3" fill="url(#cyanLinear)" />
    </g>

    <!-- KPI Metric Badges Grid -->
    <g transform="translate(0, 142)">
      <!-- KPI 1 -->
      <rect x="0" y="0" width="125" height="52" rx="8" fill="#0E121B" stroke="#262D3D" stroke-width="1" />
      <text x="12" y="20" fill="#6B7280" class="hud-font" font-size="9" letter-spacing="1">QA STATUS</text>
      <text x="12" y="40" fill="#22C55E" class="hud-font" font-size="14" font-weight="800">0 LINTS</text>

      <!-- KPI 2 -->
      <rect x="135" y="0" width="125" height="52" rx="8" fill="#0E121B" stroke="#262D3D" stroke-width="1" />
      <text x="147" y="20" fill="#6B7280" class="hud-font" font-size="9" letter-spacing="1">TEST SUITE</text>
      <text x="147" y="40" fill="#FFD700" class="hud-font" font-size="14" font-weight="800">194 PASS</text>

      <!-- KPI 3 -->
      <rect x="270" y="0" width="135" height="52" rx="8" fill="#0E121B" stroke="#262D3D" stroke-width="1" />
      <text x="282" y="20" fill="#6B7280" class="hud-font" font-size="9" letter-spacing="1">ARCH FOCUS</text>
      <text x="282" y="40" fill="#00F0FF" class="hud-font" font-size="13" font-weight="800">OFFLINE-1ST</text>

      <!-- KPI 4 -->
      <rect x="415" y="0" width="125" height="52" rx="8" fill="#0E121B" stroke="#262D3D" stroke-width="1" />
      <text x="427" y="20" fill="#6B7280" class="hud-font" font-size="9" letter-spacing="1">LOCATION</text>
      <text x="427" y="40" fill="#E5E7EB" class="hud-font" font-size="13" font-weight="800">INDIA 🇮🇳</text>
    </g>
  </g>
</svg>
