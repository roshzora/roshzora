<svg width="100%" height="auto" viewBox="0 0 880 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="stackBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080A10" />
      <stop offset="100%" stop-color="#040508" />
    </linearGradient>

    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#FF9E00" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <filter id="nodeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes corePulse {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.1); opacity: 1; }
      }
      @keyframes orbitRotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .orbit-spin { animation: orbitRotate 30s infinite linear; transform-origin: 440px 130px; }
      .core-anim { animation: corePulse 3s infinite ease-in-out; transform-origin: 440px 130px; }
      .tech-lbl { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace; }
    </style>
  </defs>

  <!-- Canvas Frame -->
  <rect x="2" y="2" width="876" height="256" rx="14" fill="url(#stackBg)" stroke="#1F2538" stroke-width="1.2" />

  <!-- Orbit Rings -->
  <g stroke="#262E45" stroke-width="1" fill="none" opacity="0.6">
    <ellipse cx="440" cy="130" rx="360" ry="95" stroke-dasharray="6 6" />
    <ellipse cx="440" cy="130" rx="240" ry="65" stroke-dasharray="4 8" />
    <ellipse cx="440" cy="130" rx="120" ry="35" stroke="#FFD700" stroke-opacity="0.3" />
  </g>

  <!-- Ambient Center Sun -->
  <circle cx="440" cy="130" r="100" fill="url(#sunGlow)" opacity="0.4" />

  <!-- Center Core -->
  <g class="core-anim">
    <circle cx="440" cy="130" r="32" fill="#121622" stroke="#FFD700" stroke-width="2" filter="url(#nodeGlow)" />
    <!-- Mini Lightning Center -->
    <path d="M 440 115 L 445 125 L 439 126 L 444 144 L 434 131 L 439 130 Z" fill="#FFD700" />
    <text x="440" y="152" fill="#E5E7EB" class="tech-lbl" font-size="8" font-weight="800" text-anchor="middle" letter-spacing="1.5">TECH CORE</text>
  </g>

  <!-- Tech Nodes (Balanced Grid/Cluster for 100% Readability & Crispness) -->

  <!-- Left Cluster: Mobile & Frontend -->
  <!-- Node 1: Flutter -->
  <g transform="translate(100, 50)">
    <rect width="130" height="34" rx="8" fill="#0E121D" stroke="#02569B" stroke-width="1.2" />
    <circle cx="20" cy="17" r="5" fill="#02569B" filter="url(#nodeGlow)" />
    <text x="34" y="22" fill="#FFFFFF" class="tech-lbl" font-size="12" font-weight="700">Flutter</text>
    <text x="96" y="22" fill="#00F0FF" class="tech-lbl" font-size="9" font-weight="600">v3.x</text>
  </g>

  <!-- Node 2: Dart -->
  <g transform="translate(250, 40)">
    <rect width="120" height="34" rx="8" fill="#0E121D" stroke="#0175C2" stroke-width="1.2" />
    <circle cx="20" cy="17" r="5" fill="#0175C2" filter="url(#nodeGlow)" />
    <text x="34" y="22" fill="#FFFFFF" class="tech-lbl" font-size="12" font-weight="700">Dart</text>
    <text x="80" y="22" fill="#9CA3AF" class="tech-lbl" font-size="9">Async</text>
  </g>

  <!-- Node 3: React & Next.js -->
  <g transform="translate(60, 115)">
    <rect width="140" height="34" rx="8" fill="#0E121D" stroke="#61DAFB" stroke-width="1.2" />
    <circle cx="20" cy="17" r="5" fill="#61DAFB" filter="url(#nodeGlow)" />
    <text x="34" y="22" fill="#FFFFFF" class="tech-lbl" font-size="12" font-weight="700">React &amp; Next</text>
  </g>

  <!-- Node 4: TypeScript -->
  <g transform="translate(190, 175)">
    <rect width="135" height="34" rx="8" fill="#0E121D" stroke="#3178C6" stroke-width="1.2" />
    <circle cx="20" cy="17" r="5" fill="#3178C6" filter="url(#nodeGlow)" />
    <text x="34" y="22" fill="#FFFFFF" class="tech-lbl" font-size="12" font-weight="700">TypeScript</text>
  </g>

  <!-- Node 5: Android SDK / Kotlin -->
  <g transform="translate(40, 185)">
    <rect width="135" height="34" rx="8" fill="#0E121D" stroke="#3DDC84" stroke-width="1.2" />
    <circle cx="20" cy="17" r="5" fill="#3DDC84" filter="url(#nodeGlow)" />
    <text x="34" y="22" fill="#FFFFFF" class="tech-lbl" font-size="11.5" font-weight="700">Android SDK</text>
  </g>

  <!-- Right Cluster: Backend, Data & AI -->
  <!-- Node 6: SQLite (Offline-First) -->
  <g transform="translate(510, 40)">
    <rect width="130" height="34" rx="8" fill="#0E121D" stroke="#FFD700" stroke-width="1.2" />
    <circle cx="20" cy="17" r="5" fill="#FFD700" filter="url(#nodeGlow)" />
    <text x="34" y="22" fill="#FFFFFF" class="tech-lbl" font-size="12" font-weight="700">SQLite v5</text>
    <text x="96" y="22" fill="#FFD700" class="tech-lbl" font-size="9">Local</text>
  </g>

  <!-- Node 7: Supabase -->
  <g transform="translate(660, 50)">
    <rect width="135" height="34" rx="8" fill="#0E121D" stroke="#3ECF8E" stroke-width="1.2" />
    <circle cx="20" cy="17" r="5" fill="#3ECF8E" filter="url(#nodeGlow)" />
    <text x="34" y="22" fill="#FFFFFF" class="tech-lbl" font-size="12" font-weight="700">Supabase</text>
    <text x="100" y="22" fill="#3ECF8E" class="tech-lbl" font-size="9">Sync</text>
  </g>

  <!-- Node 8: Google Gemini AI -->
  <g transform="translate(680, 115)">
    <rect width="150" height="34" rx="8" fill="#0E121D" stroke="#8E75B2" stroke-width="1.2" />
    <circle cx="20" cy="17" r="5" fill="#8E75B2" filter="url(#nodeGlow)" />
    <text x="34" y="22" fill="#FFFFFF" class="tech-lbl" font-size="12" font-weight="700">Gemini AI / RAG</text>
  </g>

  <!-- Node 9: Python -->
  <g transform="translate(555, 175)">
    <rect width="130" height="34" rx="8" fill="#0E121D" stroke="#3776AB" stroke-width="1.2" />
    <circle cx="20" cy="17" r="5" fill="#3776AB" filter="url(#nodeGlow)" />
    <text x="34" y="22" fill="#FFFFFF" class="tech-lbl" font-size="12" font-weight="700">Python</text>
    <text x="90" y="22" fill="#FFD700" class="tech-lbl" font-size="9">AI</text>
  </g>

  <!-- Node 10: Docker & Linux -->
  <g transform="translate(705, 185)">
    <rect width="140" height="34" rx="8" fill="#0E121D" stroke="#2496ED" stroke-width="1.2" />
    <circle cx="20" cy="17" r="5" fill="#2496ED" filter="url(#nodeGlow)" />
    <text x="34" y="22" fill="#FFFFFF" class="tech-lbl" font-size="11.5" font-weight="700">Docker &amp; Linux</text>
  </g>
</svg>
