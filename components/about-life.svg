<svg width="100%" height="auto" viewBox="0 0 880 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="zenCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D0F18" />
      <stop offset="100%" stop-color="#06070B" />
    </linearGradient>

    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#FF9E00" />
    </linearGradient>

    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0072FF" />
    </linearGradient>

    <filter id="zenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .text-body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace; }
      .kanji-large { font-family: 'Hiragino Mincho ProN', 'Yu Mincho', serif; }
    </style>
  </defs>

  <!-- Left Card: Philosophy -->
  <g transform="translate(10, 10)">
    <rect width="420" height="200" rx="12" fill="url(#zenCardBg)" stroke="#232738" stroke-width="1.2" />
    <!-- Header Accent -->
    <rect x="0" y="0" width="420" height="4" rx="2" fill="url(#goldAccent)" />

    <g transform="translate(24, 30)">
      <text x="0" y="0" fill="#FFD700" class="text-body" font-size="11" font-weight="800" letter-spacing="1.5">⚡ PHILOSOPHY // THE THUNDER WAY</text>

      <text x="0" y="32" fill="#FFFFFF" class="text-body" font-size="14" font-weight="700">"Hone one technique to its limit."</text>
      
      <text x="0" y="60" fill="#9CA3AF" class="text-body" font-size="12" font-weight="400">
        <tspan x="0" dy="0">Focusing relentlessly on deep mastery over</tspan>
        <tspan x="0" dy="18">surface-level breadth. Building software that is</tspan>
        <tspan x="0" dy="18">resilient without network, blazing fast at 120 FPS,</tspan>
        <tspan x="0" dy="18">and designed with uncompromising visual beauty.</tspan>
      </text>

      <!-- Badge row -->
      <g transform="translate(0, 108)">
        <rect x="0" y="0" width="115" height="22" rx="4" fill="#141824" stroke="#FFD700" stroke-width="0.8" />
        <text x="10" y="15" fill="#FFD700" class="text-body" font-size="9.5" font-weight="600">⚡ High Precision</text>

        <rect x="125" y="0" width="110" height="22" rx="4" fill="#141824" stroke="#2D3748" stroke-width="0.8" />
        <text x="135" y="15" fill="#E5E7EB" class="text-body" font-size="9.5" font-weight="600">🛡️ Zero Fluff</text>
      </g>
    </g>
  </g>

  <!-- Right Card: Engineering Focus -->
  <g transform="translate(450, 10)">
    <rect width="420" height="200" rx="12" fill="url(#zenCardBg)" stroke="#232738" stroke-width="1.2" />
    <!-- Header Accent -->
    <rect x="0" y="0" width="420" height="4" rx="2" fill="url(#cyanAccent)" />

    <g transform="translate(24, 30)">
      <text x="0" y="0" fill="#00F0FF" class="text-body" font-size="11" font-weight="800" letter-spacing="1.5">🌀 ENGINEERING DISCIPLINES</text>

      <!-- Focus 1 -->
      <g transform="translate(0, 22)">
        <circle cx="6" cy="6" r="3" fill="#00F0FF" filter="url(#zenGlow)" />
        <text x="18" y="10" fill="#FFFFFF" class="text-body" font-size="12" font-weight="700">Offline-First &amp; SQLite Engines</text>
        <text x="18" y="26" fill="#9CA3AF" class="text-body" font-size="11">Outbox pattern, cloud-sync, transactional integrity.</text>
      </g>

      <!-- Focus 2 -->
      <g transform="translate(0, 64)">
        <circle cx="6" cy="6" r="3" fill="#FFD700" filter="url(#zenGlow)" />
        <text x="18" y="10" fill="#FFFFFF" class="text-body" font-size="12" font-weight="700">Cross-Platform UI &amp; Gyro Telemetry</text>
        <text x="18" y="26" fill="#9CA3AF" class="text-body" font-size="11">Ultra-responsive Android TV, mobile apps, &amp; sensors.</text>
      </g>

      <!-- Focus 3 -->
      <g transform="translate(0, 106)">
        <circle cx="6" cy="6" r="3" fill="#00F0FF" filter="url(#zenGlow)" />
        <text x="18" y="10" fill="#FFFFFF" class="text-body" font-size="12" font-weight="700">Atmospheric Data &amp; AI RAG</text>
        <text x="18" y="26" fill="#9CA3AF" class="text-body" font-size="11">Radar nowcast models, Gemini integration, embeddings.</text>
      </g>
    </g>
  </g>
</svg>
