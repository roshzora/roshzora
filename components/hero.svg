<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#FADA5E" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#4D94FF" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="nameClip">
      <rect x="0" y="150" width="400" height="60">
        <animate attributeName="y" from="210" to="150" dur="1s" fill="freeze" begin="0.5s" />
      </rect>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="#050505" />
  
  <!-- Thunder background effect -->
  <g stroke="#00E5FF" stroke-width="2" fill="none" filter="url(#glow)" opacity="0.3">
    <polyline points="100,0 120,50 110,80 140,120 130,160 160,200" stroke-dasharray="1000">
      <animate attributeName="stroke-dashoffset" from="1000" to="0" dur="2s" repeatCount="indefinite" />
    </polyline>
    <polyline points="700,0 680,60 690,100 660,150 670,200 640,250" stroke-dasharray="1000">
      <animate attributeName="stroke-dashoffset" from="1000" to="0" dur="2.5s" repeatCount="indefinite" />
    </polyline>
  </g>

  <!-- Viewfinder Corners -->
  <g stroke="#FFD700" stroke-width="4" fill="none">
    <!-- Top Left -->
    <path d="M 50 80 L 50 50 L 80 50">
      <animate attributeName="stroke-width" values="0;4;0" dur="0.5s" repeatCount="indefinite" />
    </path>
    <!-- Top Right -->
    <path d="M 750 50 L 720 50 L 720 80" />
    <!-- Bottom Left -->
    <path d="M 50 350 L 50 320 L 80 320" />
    <!-- Bottom Right -->
    <path d="M 750 320 L 750 350 L 720 350" />
  </g>

  <!-- REC Indicator -->
  <g transform="translate(70, 60)">
    <circle r="5" fill="#FF0000">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
    </circle>
    <text x="12" y="4" fill="#FFFFFF" font-family="monospace" font-size="12">REC</text>
  </g>

  <!-- Character Placeholder -->
  <g transform="translate(450, 50)">
    <!-- Silhouette of Zenitsu / Placeholder -->
    <rect width="300" height="300" rx="20" fill="#1A1A1A" stroke="#FFD700" stroke-width="1" opacity="0.5" />
    <text x="150" y="150" text-anchor="middle" fill="#FFD700" font-family="sans-serif" font-size="14" opacity="0.6">ZENITSU_ACTION_POSE.PNG</text>
    <!-- Lightning Aura -->
    <path d="M 0 150 Q 50 130 100 150 T 200 150" stroke="#00E5FF" stroke-width="2" fill="none" filter="url(#glow)">
      <animate attributeName="d" 
               values="M 0 150 Q 50 130 100 150 T 200 150; M 0 150 Q 50 170 100 150 T 200 150; M 0 150 Q 50 130 100 150 T 200 150" 
               dur="0.2s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Text Content -->
  <g transform="translate(50, 150)">
    <text x="0" y="20" fill="#A0A0A0" font-family="sans-serif" font-size="18">Hi there, I'm</text>
    <g clip-path="url(#nameClip)">
      <text x="0" y="70" fill="url(#goldGrad)" font-family="sans-serif" font-weight="bold" font-size="54" filter="url(#glow)">ROSHZEN</text>
    </g>
    
    <!-- Cycling Roles -->
    <text x="0" y="110" fill="#FFFFFF" font-family="monospace" font-size="16">
      <tspan>Frontend Architect</tspan>
      <animate attributeName="opacity" values="1;0" dur="3s" begin="1s" fill="freeze" />
    </text>
    <text x="0" y="110" fill="#FFFFFF" font-family="monospace" font-size="16" opacity="0">
      <tspan>SVG Animation Specialist</tspan>
      <animate attributeName="opacity" values="0;1" dur="3s" begin="3s" fill="freeze" />
    </text>
  </g>

  <!-- Bottom Meta Row -->
  <g transform="translate(50, 330)" fill="#A0A0A0" font-family="sans-serif" font-size="14">
    <text x="0" y="0">📍 India</text>
    <text x="100" y="0">💼 Independent</text>
    <text x="200" y="0">⭐ 500+ Stars</text>
  </g>
</svg>
