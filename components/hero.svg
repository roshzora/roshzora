<svg width="100%" height="auto" viewBox="0 0 920 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090E" />
      <stop offset="50%" stop-color="#0E1017" />
      <stop offset="100%" stop-color="#05060A" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF275" />
      <stop offset="35%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#FF9E00" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A6FBFF" />
      <stop offset="50%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0077FF" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#FFD700" stop-opacity="0.2" />
      <stop offset="70%" stop-color="#00F0FF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#FFD700" />
      <stop offset="80%" stop-color="#FF9900" />
      <stop offset="100%" stop-color="#1A1820" />
    </linearGradient>

    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0" />
    </radialGradient>

    <!-- Filters -->
    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes lightningFlicker {
        0%, 100% { opacity: 0.15; }
        5% { opacity: 0.95; }
        6% { opacity: 0.3; }
        10% { opacity: 1; }
        15% { opacity: 0.2; }
        50% { opacity: 0.15; }
        52% { opacity: 0.85; }
        54% { opacity: 0.25; }
        70% { opacity: 0.15; }
      }
      @keyframes pulseHalo {
        0%, 100% { transform: scale(1); opacity: 0.35; }
        50% { transform: scale(1.08); opacity: 0.65; }
      }
      @keyframes bladeGleam {
        0%, 100% { stroke-dashoffset: 400; opacity: 0.3; }
        50% { stroke-dashoffset: 0; opacity: 1; }
      }
      @keyframes scanVertical {
        0% { transform: translateY(-50px); opacity: 0; }
        50% { opacity: 0.6; }
        100% { transform: translateY(350px); opacity: 0; }
      }
      .lightning-fx { animation: lightningFlicker 4s infinite ease-in-out; }
      .blade-fx { stroke-dasharray: 400; animation: bladeGleam 3.5s infinite linear; }
      .halo-fx { animation: pulseHalo 4s infinite ease-in-out; transform-origin: 720px 170px; }
      .hud-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace; }
      .kanji-text { font-family: 'Hiragino Mincho ProN', 'Yu Mincho', 'MS PMincho', serif; }
    </style>
  </defs>

  <!-- Card Frame -->
  <rect x="2" y="2" width="916" height="336" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Ambient Glow Orbs -->
  <circle cx="160" cy="170" r="140" fill="url(#cyanGlow)" opacity="0.3" />
  <circle cx="720" cy="170" r="160" fill="url(#goldGlow)" class="halo-fx" />

  <!-- Tech Perspective Grid Lines -->
  <g opacity="0.12" stroke="#00F0FF" stroke-width="1">
    <line x1="0" y1="280" x2="920" y2="280" />
    <line x1="0" y1="305" x2="920" y2="305" />
    <line x1="0" y1="325" x2="920" y2="325" />
    <line x1="100" y1="260" x2="50" y2="340" />
    <line x1="200" y1="260" x2="160" y2="340" />
    <line x1="300" y1="260" x2="270" y2="340" />
    <line x1="400" y1="260" x2="380" y2="340" />
    <line x1="500" y1="260" x2="490" y2="340" />
    <line x1="600" y1="260" x2="600" y2="340" />
    <line x1="700" y1="260" x2="710" y2="340" />
    <line x1="800" y1="260" x2="820" y2="340" />
  </g>

  <!-- Cyber Top HUD Bar -->
  <g transform="translate(24, 20)">
    <!-- Terminal Dots -->
    <circle cx="6" cy="6" r="4" fill="#FF5F56" />
    <circle cx="20" cy="6" r="4" fill="#FFBD2E" />
    <circle cx="34" cy="6" r="4" fill="#27C93F" />

    <text x="50" y="10" fill="#6B7280" class="hud-text" font-size="11" letter-spacing="1.5">SYS.EXEC // ARUN_ROSHAN.CORE_V2.5</text>

    <!-- Top Right Status -->
    <g transform="translate(680, 0)">
      <rect x="0" y="-3" width="180" height="20" rx="10" fill="#131620" stroke="#00F0FF" stroke-opacity="0.3" stroke-width="1" />
      <circle cx="12" cy="7" r="3.5" fill="#00F0FF" filter="url(#glowCyan)" />
      <text x="24" y="11" fill="#E5E7EB" class="hud-text" font-size="10" font-weight="600" letter-spacing="1">STATUS: OVERCLOCKED</text>
    </g>
  </g>

  <!-- Large Japanese Kanji Background Watermark -->
  <g opacity="0.06" class="kanji-text">
    <text x="460" y="240" font-size="160" font-weight="900" fill="#FFD700" text-anchor="middle">霹靂一閃</text>
  </g>

  <!-- Lightning Bolt Path FX -->
  <g class="lightning-fx" stroke-linecap="round" stroke-linejoin="round">
    <!-- Bolt 1 Left -->
    <path d="M 60 40 L 95 110 L 80 120 L 130 185 L 115 195 L 160 250" stroke="#00F0FF" stroke-width="2.2" fill="none" filter="url(#glowCyan)" />
    <!-- Bolt 2 Center-Right -->
    <path d="M 540 25 L 520 85 L 535 90 L 505 160 L 520 165 L 485 240" stroke="#FFD700" stroke-width="2.2" fill="none" filter="url(#glowGold)" />
    <!-- Small sparks -->
    <polygon points="170,120 173,128 181,131 173,134 170,142 167,134 159,131 167,128" fill="#00F0FF" opacity="0.8" />
    <polygon points="560,190 562,195 567,197 562,199 560,204 558,199 553,197 558,195" fill="#FFD700" opacity="0.9" />
  </g>

  <!-- Center-Left Typography & Identity -->
  <g transform="translate(48, 85)">
    <!-- Form Badge -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="240" height="24" rx="4" fill="#FFD700" fill-opacity="0.1" stroke="#FFD700" stroke-width="1" />
      <text x="10" y="16" fill="#FFD700" class="hud-text" font-size="10.5" font-weight="700" letter-spacing="2">⚡ THUNDER BREATHING : FORM I</text>
    </g>

    <!-- Main Title: ROSHZEN -->
    <text x="0" y="78" fill="url(#goldGrad)" class="hud-text" font-size="52" font-weight="900" letter-spacing="4" filter="url(#glowGold)">ROSHZEN</text>

    <!-- Subtitle / Title -->
    <g transform="translate(0, 106)">
      <text x="0" y="0" fill="#FFFFFF" class="hud-text" font-size="16" font-weight="700" letter-spacing="1">Arun Roshan</text>
      <text x="120" y="0" fill="#00F0FF" class="hud-text" font-size="16" font-weight="700">|</text>
      <text x="135" y="0" fill="#9CA3AF" class="hud-text" font-size="14.5" font-weight="500">Full-Stack &amp; Mobile Architect</text>
    </g>

    <!-- Core Domains Chips -->
    <g transform="translate(0, 130)">
      <!-- Chip 1 -->
      <rect x="0" y="0" width="105" height="26" rx="6" fill="#131722" stroke="#2D3748" stroke-width="1" />
      <text x="12" y="17" fill="#00F0FF" class="hud-text" font-size="11" font-weight="600">📱 Flutter &amp; Dart</text>

      <!-- Chip 2 -->
      <rect x="115" y="0" width="100" height="26" rx="6" fill="#131722" stroke="#2D3748" stroke-width="1" />
      <text x="127" y="17" fill="#FFD700" class="hud-text" font-size="11" font-weight="600">⚡ Offline-First</text>

      <!-- Chip 3 -->
      <rect x="225" y="0" width="105" height="26" rx="6" fill="#131722" stroke="#2D3748" stroke-width="1" />
      <text x="237" y="17" fill="#E5E7EB" class="hud-text" font-size="11" font-weight="600">🧠 AI RAG Tutor</text>

      <!-- Chip 4 -->
      <rect x="340" y="0" width="95" height="26" rx="6" fill="#131722" stroke="#2D3748" stroke-width="1" />
      <text x="352" y="17" fill="#00F0FF" class="hud-text" font-size="11" font-weight="600">🌐 Full-Stack</text>
    </g>

    <!-- Quote / Motto -->
    <text x="2" y="185" fill="#6B7280" class="hud-text" font-size="11.5" font-style="italic">
      "Hone one technique to absolute perfection. Strike like thunder."
    </text>
  </g>

  <!-- Right Section: Cyber Blade & Radar Emblem (100% Vector) -->
  <g transform="translate(710, 170)">
    <!-- Rotating Radar Rings -->
    <circle cx="0" cy="0" r="105" stroke="#FFD700" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="8 6" />
    <circle cx="0" cy="0" r="85" stroke="#00F0FF" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="4 8" />
    <circle cx="0" cy="0" r="60" stroke="#FFD700" stroke-opacity="0.3" stroke-width="1.5" />
    <circle cx="0" cy="0" r="30" fill="#0D111A" stroke="#00F0FF" stroke-width="1.5" />

    <!-- Katana Blade Silhouette & Thunder Aura -->
    <g transform="rotate(-35)">
      <!-- Blade Spine -->
      <path d="M 0 -95 C 10 -40 12 40 4 90 L -4 90 C 4 40 2 -40 -2 -95 Z" fill="url(#bladeGrad)" />
      <!-- Hamon / Lightning Line along blade -->
      <path d="M 2 -90 Q 7 -50 2 -20 Q 8 20 2 60 L 2 85" stroke="#FFFFFF" stroke-width="2" fill="none" class="blade-fx" filter="url(#glowGold)" />
      <!-- Habaki & Tsuba (Guard) -->
      <rect x="-16" y="86" width="32" height="6" rx="2" fill="#FFD700" filter="url(#glowGold)" />
      <!-- Tsuka (Hilt) -->
      <rect x="-7" y="92" width="14" height="42" rx="3" fill="#15171E" stroke="#FFD700" stroke-width="1.5" />
      <!-- Hilt Wrap Diamond Crosses -->
      <polygon points="0,96 4,101 0,106 -4,101" fill="#FFD700" />
      <polygon points="0,107 4,112 0,117 -4,112" fill="#FFD700" />
      <polygon points="0,118 4,123 0,128 -4,123" fill="#FFD700" />
    </g>

    <!-- Dynamic Japanese Seal Stamp -->
    <g transform="translate(48, -78)">
      <rect x="0" y="0" width="32" height="54" rx="4" fill="#FFD700" fill-opacity="0.15" stroke="#FFD700" stroke-width="1" />
      <text x="16" y="22" fill="#FFD700" class="kanji-text" font-size="14" font-weight="900" text-anchor="middle">雷</text>
      <text x="16" y="44" fill="#FFD700" class="kanji-text" font-size="14" font-weight="900" text-anchor="middle">神</text>
    </g>

    <!-- Floating HUD Telemetry Pill -->
    <g transform="translate(-85, 82)">
      <rect x="0" y="0" width="170" height="24" rx="12" fill="#0C0F17" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.5" />
      <text x="85" y="16" fill="#A6FBFF" class="hud-text" font-size="9.5" font-weight="700" text-anchor="middle" letter-spacing="1">⚡ 1ST FORM : CLAP &amp; FLASH</text>
    </g>
  </g>

  <!-- Bottom Border Glow Segment -->
  <line x1="280" y1="338" x2="640" y2="338" stroke="url(#goldGrad)" stroke-width="2" filter="url(#glowGold)" />
</svg>
